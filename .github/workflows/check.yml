name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y make perl poppler-utils ripgrep
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install --group dev
      - name: Install MathJax
        run: npm ci
      - name: Check maintainer environment
        run: make doctor

      - name: Determine changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          changed_paths="$RUNNER_TEMP/changed-paths.txt"
          : > "$changed_paths"
          diff_base=

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: no changed-paper scope selected"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            diff_base=$(git merge-base "origin/$BASE_REF" HEAD || true)
            if [ -n "$diff_base" ] && git cat-file -e "$diff_base^{commit}"; then
              git diff --name-only -z "$diff_base..HEAD" > "$changed_paths"
            else
              echo "Cannot determine a trusted pull-request diff base" >&2
              exit 1
            fi
          elif [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "$BEFORE_SHA^{commit}"; then
            diff_base=$BEFORE_SHA
            git diff --name-only -z "$BEFORE_SHA..$CURRENT_SHA" > "$changed_paths"
          elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ] &&
               [ -n "$DEFAULT_BRANCH" ]; then
            diff_base=$(git merge-base "origin/$DEFAULT_BRANCH" "$CURRENT_SHA" || true)
            if [ -n "$diff_base" ] && git cat-file -e "$diff_base^{commit}"; then
              git diff --name-only -z "$diff_base..$CURRENT_SHA" > "$changed_paths"
            else
              echo "Cannot determine a trusted branch diff base" >&2
              exit 1
            fi
          else
            echo "Cannot determine a trusted push diff base" >&2
            exit 1
          fi

          echo "diff_base=$diff_base" >> "$GITHUB_OUTPUT"

      - name: Select validation scope
        id: scope
        env:
          DIFF_BASE: ${{ steps.changes.outputs.diff_base }}
        run: |
          args=()
          if [ -n "$DIFF_BASE" ]; then
            args+=(--base-sha "$DIFF_BASE")
          fi
          python scripts/ci_validation_scope.py "${args[@]}" \
            < "$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_OUTPUT"

      - name: Run archive gate
        run: make check

      - name: Run scoped paper gates
        if: steps.scope.outputs.paper_ids != ''
        env:
          PAPER_IDS: ${{ steps.scope.outputs.paper_ids }}
        run: |
          while IFS= read -r paper_id; do
            [ -n "$paper_id" ] || continue
            paper_dir=$(find papers -mindepth 2 -maxdepth 2 -type d \
              -name "$paper_id" -print -quit)
            if [ -z "$paper_dir" ]; then
              echo "Skipping removed paper: $paper_id"
              continue
            fi
            make paper-check PAPER_ID="$paper_id"
          done <<< "$PAPER_IDS"

      - name: Check whitespace
        env:
          CURRENT_SHA: ${{ github.sha }}
          DIFF_BASE: ${{ steps.changes.outputs.diff_base }}
        run: |
          if [ -n "$DIFF_BASE" ] && git cat-file -e "$DIFF_BASE^{commit}"; then
            git diff --check "$DIFF_BASE..$CURRENT_SHA"
          else
            empty_tree=$(git hash-object -t tree /dev/null)
            git diff --check "$empty_tree..$CURRENT_SHA"
          fi
