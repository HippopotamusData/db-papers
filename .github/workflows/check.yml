name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archive-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y make perl poppler-utils ripgrep
      - name: Bootstrap maintainer environment
        run: make bootstrap

      - name: Determine changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          changed_paths="$RUNNER_TEMP/changed-paths.txt"
          : > "$changed_paths"
          diff_base=

          if [ "$EVENT_NAME" = "pull_request" ]; then
            diff_base=$(git merge-base "origin/$BASE_REF" HEAD || true)
            if [ -n "$diff_base" ] && git cat-file -e "$diff_base^{commit}"; then
              git diff --name-only -z "$diff_base..HEAD" > "$changed_paths"
            else
              echo "Cannot determine a trusted pull-request diff base" >&2
              exit 1
            fi
          elif [ "$EVENT_NAME" = "push" ] &&
               [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            if [ -z "$BEFORE_SHA" ] ||
               [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] ||
               ! git cat-file -e "$BEFORE_SHA^{commit}"; then
              echo "Cannot resolve a trusted push diff base" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$BEFORE_SHA" "$CURRENT_SHA"; then
              echo "Push diff base is not an ancestor of the current commit" >&2
              exit 1
            fi
            diff_base=$BEFORE_SHA
            git diff --name-only -z "$BEFORE_SHA..$CURRENT_SHA" > "$changed_paths"
          else
            echo "Unsupported validation event or branch" >&2
            exit 1
          fi

          echo "diff_base=$diff_base" >> "$GITHUB_OUTPUT"

      - name: Select validation scope
        id: scope
        env:
          DIFF_BASE: ${{ steps.changes.outputs.diff_base }}
        run: |
          args=()
          if [ -n "$DIFF_BASE" ]; then
            args+=(--base-sha "$DIFF_BASE")
          fi
          .venv/bin/python scripts/ci_validation_scope.py "${args[@]}" \
            < "$RUNNER_TEMP/changed-paths.txt" >> "$GITHUB_OUTPUT"

      - name: Run archive gate
        if: steps.scope.outputs.deep_validate_all != 'true'
        run: make check

      - name: Run global deep validation
        if: steps.scope.outputs.deep_validate_all == 'true'
        run: make test _deep-validate-check _catalog-check

      - name: Run scoped paper gates
        if: >-
          steps.scope.outputs.deep_validate_all != 'true' &&
          steps.scope.outputs.paper_ids != ''
        env:
          PAPER_IDS: ${{ steps.scope.outputs.paper_ids }}
        run: |
          while IFS= read -r paper_id; do
            [ -n "$paper_id" ] || continue
            paper_dir=$(find papers -mindepth 2 -maxdepth 2 -type d \
              -name "$paper_id" -print -quit)
            if [ -z "$paper_dir" ]; then
              echo "Skipping removed paper: $paper_id"
              continue
            fi
            make paper-check PAPER_ID="$paper_id"
          done <<< "$PAPER_IDS"

      - name: Run full math gate
        if: steps.scope.outputs.math_all == 'true'
        run: make math-check

      - name: Run scoped math gate
        if: >-
          steps.scope.outputs.math_all != 'true' &&
          steps.scope.outputs.math_files != ''
        env:
          MATH_FILES: ${{ steps.scope.outputs.math_files }}
        run: |
          files=()
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [ -f "$file" ]; then
              files+=("$file")
            else
              echo "Skipping removed translation: $file"
            fi
          done <<< "$MATH_FILES"
          if [ "${#files[@]}" -gt 0 ]; then
            make math-check-files FILES="${files[*]}"
          fi

      - name: Audit changed GitHub math
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DIFF_BASE: ${{ steps.changes.outputs.diff_base }}
          AUDIT_ALL: ${{ steps.scope.outputs.math_all }}
        run: PYTHON=.venv/bin/python scripts/audit_changed_math.sh "$DIFF_BASE"

      - name: Check whitespace
        env:
          CURRENT_SHA: ${{ github.sha }}
          DIFF_BASE: ${{ steps.changes.outputs.diff_base }}
        run: |
          if [ -n "$DIFF_BASE" ] && git cat-file -e "$DIFF_BASE^{commit}"; then
            git diff --check "$DIFF_BASE..$CURRENT_SHA"
          else
            empty_tree=$(git hash-object -t tree /dev/null)
            git diff --check "$empty_tree..$CURRENT_SHA"
          fi

  site-build:
    runs-on: ubuntu-24.04
    outputs:
      smoke: ${{ steps.smoke.outputs.manifest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install validation planner dependency
        run: python -m pip install "PyYAML==6.0.3"
      - name: Determine site impact
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          CURRENT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            diff_base=$BEFORE_SHA
            if [ -z "$diff_base" ] || ! git merge-base --is-ancestor "$diff_base" "$CURRENT_SHA"; then
              echo "Cannot determine a trusted push Pages diff base" >&2
              exit 1
            fi
          else
            diff_base=$(git merge-base "origin/$BASE_REF" HEAD || true)
          fi
          if [ -z "$diff_base" ] || ! git cat-file -e "$diff_base^{commit}"; then
            echo "Cannot determine a trusted pull-request Pages diff base" >&2
            exit 1
          fi

          git diff --name-only -z "$diff_base..$CURRENT_SHA" \
            > "$RUNNER_TEMP/pages-changed-paths"
          python scripts/ci_validation_scope.py \
            --base-sha "$diff_base" --head-sha "$CURRENT_SHA" \
            < "$RUNNER_TEMP/pages-changed-paths" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ]; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
            echo "Main push: forcing a complete production build"
          fi
      - name: Install site dependencies
        if: steps.scope.outputs.site_changed == 'true'
        run: make bootstrap-site
      - name: Build and verify reader site
        if: steps.scope.outputs.site_changed == 'true'
        run: make site-check
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.scope.outputs.browser_changed == 'true'
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install browser test dependencies
        if: steps.scope.outputs.browser_changed == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test reader interactions
        if: steps.scope.outputs.browser_changed == 'true'
        run: npm run test:site
      - name: Record artifact smoke expectations
        id: smoke
        if: github.event_name == 'push'
        run: python scripts/site_smoke.py manifest --site site --sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload GitHub Pages artifact
        if: >-
          github.event_name == 'push' &&
          steps.scope.outputs.site_changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.archive-check.result == 'success' &&
      needs.site-build.result == 'success'
    needs: [archive-check, site-build]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify deployed pages and assets
        env:
          SITE_SMOKE_MANIFEST: ${{ needs.site-build.outputs.smoke }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/site_smoke.py verify --url "$SITE_URL" --sha "$GITHUB_SHA"
