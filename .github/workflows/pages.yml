name: pages

on:
  pull_request:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: >-
    pages-${{
      github.event_name == 'pull_request' &&
      format('pr-{0}', github.event.pull_request.number) ||
      github.event.workflow_run.event == 'push' &&
      'production' ||
      format('ignored-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  site-build:
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install validation planner dependency
        run: python -m pip install "PyYAML==6.0.3"
      - name: Determine site impact
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          CURRENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
            echo "Successful main check: forcing a complete production build"
            exit 0
          fi

          diff_base=$(git merge-base "origin/$BASE_REF" HEAD || true)
          if [ -z "$diff_base" ] || ! git cat-file -e "$diff_base^{commit}"; then
            echo "Cannot determine a trusted pull-request Pages diff base" >&2
            exit 1
          fi

          git diff --name-only -z "$diff_base..$CURRENT_SHA" \
            > "$RUNNER_TEMP/pages-changed-paths"
          python scripts/ci_validation_scope.py \
            --base-sha "$diff_base" --head-sha "$CURRENT_SHA" \
            < "$RUNNER_TEMP/pages-changed-paths" >> "$GITHUB_OUTPUT"
      - name: Install site dependencies
        if: steps.scope.outputs.site_changed == 'true'
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install --group site
      - name: Build and verify reader site
        if: steps.scope.outputs.site_changed == 'true'
        run: make site-check PYTHON=python
      - name: Upload GitHub Pages artifact
        if: >-
          github.event_name == 'workflow_run' &&
          steps.scope.outputs.site_changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      needs.site-build.result == 'success'
    needs: site-build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          timeout: 1800000
