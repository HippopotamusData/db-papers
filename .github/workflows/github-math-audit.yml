name: github-math-audit

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: github-math-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      # pull_request_target deliberately checks out only the trusted default branch.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install trusted audit dependencies
        run: |
          python -m pip install --upgrade --only-binary=:all: --no-deps \
            "pip==26.1.2" \
            "markdown-it-py==4.2.0" \
            "mdurl==0.1.2"
      - name: Prepare Markdown data tree
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FETCH_TOKEN: ${{ github.token }}
        run: |
          FETCH_AUTH=$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $FETCH_AUTH" \
            git fetch --no-tags origin "pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER/head"
          unset FETCH_AUTH FETCH_TOKEN
          FETCHED_SHA=$(git rev-parse "refs/remotes/pull/$PR_NUMBER/head")
          if [ "$FETCHED_SHA" != "$PR_HEAD_SHA" ]; then
            echo "::error::PR head moved after this workflow was queued; refusing a stale audit."
            exit 1
          fi
          if ! git cat-file -e "$PR_BASE_SHA^{commit}"; then
            echo "::error::Cannot resolve the trusted PR base commit."
            exit 1
          fi
          TARGET_ROOT="$RUNNER_TEMP/pr-head"
          git worktree add --detach "$TARGET_ROOT" "$PR_HEAD_SHA"
          AUDIT_BASE="$PR_BASE_SHA"
          echo "TARGET_ROOT=$TARGET_ROOT" >> "$GITHUB_ENV"
          echo "AUDIT_BASE=$AUDIT_BASE" >> "$GITHUB_ENV"
      # This validator is the stable base-branch trust anchor. Ordinary PRs may
      # change protected CI files only when the current trusted policy allows it.
      - name: Validate proposed CI trust boundary
        run: python "$GITHUB_WORKSPACE/scripts/validate_ci_trust.py" --root "$TARGET_ROOT"
      - name: Audit GitHub math with trusted code
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_UNTRUSTED_DATA: "1"
        run: |
          cd "$TARGET_ROOT"
          PYTHON=python "$GITHUB_WORKSPACE/scripts/audit_changed_math.sh" "$AUDIT_BASE"
